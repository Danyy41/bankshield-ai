name: Tests

# Full verification of the BankShield AI stack on every push and PR:
# regenerate the Phase 1-3 data/models and Phase 4 eval (the test suite and
# red-team suite read them, and they're gitignored), then run the pytest
# suite and the Phase 5 red-team suite, and finally check the regenerated
# metrics against the committed ones. Dependencies are installed from the
# pinned lock, so the pipeline is reproducible run to run. Everything runs
# offline -- no AWS credentials, no live model.
#
# The `docker` job builds the production image in parallel, runs it hardened
# (read-only rootfs, no capabilities), and smoke-tests the live API.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pipeline, tests, red team (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: Agg  # headless runner: EDA/comparison scripts save figures, never show them

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c requirements-lock.txt
          pip freeze > pip-freeze.txt

      - name: Generate data, train models, run Phase 4 eval (run_all.py)
        run: python scripts/run_all.py

      - name: Run pytest suite
        run: python -m pytest -v --junitxml=pytest-results.xml

      - name: Run Phase 5 red-team suite (fails on any unblocked attack)
        run: python scripts/run_redteam.py

      - name: Check regenerated metrics match committed reports
        run: python scripts/check_reproducibility.py

      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bankshield-ci-reports
          path: |
            pytest-results.xml
            pip-freeze.txt
            reports/*.md
            reports/metrics/*.json
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bankshield-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container (read-only rootfs, no capabilities)
        run: >
          docker run -d --name bankshield -p 8000:8000
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges
          bankshield-ai:ci

      - name: Wait for container health check
        run: |
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' bankshield)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          echo "container did not become healthy"
          exit 1

      - name: Smoke test API (artifacts, offline mode, human-approval gate)
        run: python3 scripts/smoke_test_api.py http://127.0.0.1:8000

      - name: Container logs
        if: always()
        run: docker logs bankshield || true
